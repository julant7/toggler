# separate terms of service, privacy policy, and support
# documentation.

name: Scala CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
    - uses: actions/checkout@v4
    - name: Install PostgreSQL client
      run: sudo apt-get install -y postgresql-client 
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Install sbt
      uses: sbt/setup-sbt@v1
    - name: Wait for PostgreSQL
      run: |
        echo "Waiting for PostgreSQL to be ready..."
        for i in {1..15}; do
          if pg_isready -h localhost -p 5432 -U testuser -d testdb; then
            echo "PostgreSQL is ready!"
            exit 0
          fi
          echo "Attempt $i/15: PostgreSQL not ready yet..."
          sleep 2
        done
        echo "Failed to connect to PostgreSQL after 30 attempts"
        exit 1
    - name: Run tests
      run: sbt test
      env:
        TEST_DATABASE_JDBC_URL: "jdbc:postgresql://localhost:5432/testdb"
        TEST_DATABASE_USER: testuser
        TEST_DATABASE_PASSWORD: testpass
      # Optional: This step uploads information to the GitHub dependency graph and unblocking Dependabot alerts for the repository
    - name: Upload dependency graph
      uses: scalacenter/sbt-dependency-submission@ab086b50c947c9774b70f39fc7f6e20ca2706c91
    
    
    
